buildscript {
    ext {
        buildToolsVersion = "33.0.2"
        minSdkVersion = 21
        compileSdkVersion = 33
        targetSdkVersion = 33
        kotlinVersion = "1.8.10"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.0.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}


apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// 👇 Pulls React Native Gradle helpers (handles RN deps properly)
apply from: "../node_modules/react-native/react.gradle"

android {
    namespace "com.yourcompany.reactnativezebra"
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.11"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
    // 👇 local RN Android artifacts
    maven { url("$rootDir/../node_modules/react-native/android") }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    // Pull React Native directly from node_modules
    implementation "com.facebook.react:react-android:0.71.13"

    // AndroidX support libraries you’re using
    implementation "androidx.core:core:1.9.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
}
